name: Compilar instalador de Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SATH-Escritorio-Instalador-Windows
          path: dist/*Instalador.exe
          if-no-files-found: error
      - name: Publicar instalador descargable
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SATH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = (Get-ChildItem dist/*Instalador.exe).FullName
          gh release view $env:SATH_RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:SATH_RELEASE_TAG $installer --clobber
          } else {
            gh release create $env:SATH_RELEASE_TAG $installer --verify-tag --title "SATH Escritorio $env:SATH_RELEASE_TAG" --notes-file build/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
