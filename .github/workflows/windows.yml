name: Compilar instalador de Windows
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm test
      - run: npm run test:ui:v2
      - run: npm run test:ui:v3
      - name: Compilar instalador
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath build-windows.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $detail = (Get-Content build-windows.log -Tail 90) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Error al compilar Windows::$detail"
            exit $buildExit
          }
      - run: npm run test:packaged
      - name: Probar actualización real desde 2.0.0 antes de publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .test-installers | Out-Null
          gh release download v2.0.0 --repo $env:GITHUB_REPOSITORY --pattern SATH-Escritorio-2.0.0-Instalador.exe --dir .test-installers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v2.0.0" | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -eq 'SATH-Escritorio-2.0.0-Instalador.exe'
          $hash = (Get-FileHash .test-installers/SATH-Escritorio-2.0.0-Instalador.exe -Algorithm SHA256).Hash.ToLower()
          if ($asset.digest -ne "sha256:$hash") { throw 'Integridad incorrecta del instalador 2.0.0' }
          Copy-Item dist/*Instalador.exe .test-installers/
          node test/installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SATH-Escritorio-Instalador-Windows
          path: dist/*Instalador.exe
          if-no-files-found: error
      - name: Publicar instalador descargable
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SATH_COMMIT: ${{ github.sha }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -ne '3.0.0') { throw 'Publicación reservada para 3.0.0' }
          $tag = "v$version"
          $installer = (Get-ChildItem dist/*Instalador.exe).FullName
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'La versión ya está publicada. Se conserva sin reemplazar sus archivos.'
            exit 0
          }
          gh release create $tag $installer dist/SHA256SUMS.txt --target $env:SATH_COMMIT --title "Andrenelly · Formularios SATH $version" --notes-file build/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
